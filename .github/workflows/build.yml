name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project EvidenceGuard.xcodeproj \
            -scheme EvidenceGuard \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/EvidenceGuard.app Payload/
          zip -r EvidenceGuard.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EvidenceGuard-IPA
          path: EvidenceGuard.ipa
          retention-days: 30
